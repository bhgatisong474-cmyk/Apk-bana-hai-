name: Build ARJIT Boxer APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project (project.zip ya normal files)
        run: |
          if [ -f project.zip ]; then mkdir -p _p && unzip -q -o project.zip -d _p; S=$(find _p -name settings.gradle | head -1); else S=$(find . -name settings.gradle -not -path './.git/*' | head -1); fi
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARJIT-Boxer-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
